# pyproject.toml
[build-system]
requires = [
  "hatchling",
  "versioningit",
]
build-backend = "hatchling.build"

[project]
name = "pyxarr"
description = "A light-weight class to work with multi-dimensional labeled arrays."
readme = "README.md"
authors = [
  {name = "Richard van Hees", email = "R.M.van.Hees@sron.nl"},
]
license = "Apache-2.0"
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
dynamic = [
  "version",
]
dependencies = [
  "h5py>=3.14",
  "h5yaml>=0.5.4",
  "numpy>=2.0",
]

[dependency-groups]
test = [
  "pytest>=9.0",
  "pytest-cov>=7.0",
]
lint = [
  "ruff>=0.15",
]

[project.scripts]

[project.urls]
homepage = "https://github.com/rmvanhees/pyxarr"
Source = "https://github.com/rmvanhees/pyxarr"
"Issue tracker" = "https://github.com/rmvanhees/pyxarr/issues"
# Changelog = "https://github.com/rmvanhees/pyxarr/HISTORY.rst"
# Documentation = "https://pyxarr.readthedocs.io/en/latest/"

[tool.hatch.build.targets.sdist]
exclude = ["pilots"]

[tool.hatch.version]
source = "versioningit"

[tool.versioningit]

[tool.versioningit.next-version]
method = "smallest"

[tool.versioningit.format]
distance = "{next_version}.dev{distance}+{vcs}{rev}"
dirty = "{base_version}+d{build_date:%Y%m%d}"
distance-dirty = "{next_version}.dev{distance}+{vcs}{rev}.d{build_date:%Y%m%d}"

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "--import-mode=importlib --cov=pyxarr --cov-report=term"
strict = true

[tool.coverage.run]
# branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
   # 1. Comments to turn coverage on and off:
   'no cover: start(?s:.)*?no cover: stop',
]

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = [
  "pilots",
]

[tool.ruff.lint]
preview = false
extend-select = [
  "A",    # flake8-builtins
  "ANN",  # flake8-annotations
  "Q",    # flake8-quotes
  "TID",  # flake8-tidy-imports
  "NPY",  # NumPy-specific
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
